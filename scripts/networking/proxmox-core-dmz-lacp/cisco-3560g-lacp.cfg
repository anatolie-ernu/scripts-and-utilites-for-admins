! Cisco Catalyst 3560G / Cisco IOS — example only
! Replace Gi0/1-4 with verified real access port numbers.
! Do not apply on a live access uplink before coordinating host migration.
! VLAN 13 must remain TAGGED (not native); default native VLAN 1 shown by omission.
! Confirm VLANs already exist and are carried upstream toward their gateways.
configure terminal
!
interface Port-channel10
 description PROXMOX-CORE-LACP
 switchport mode trunk
 switchport trunk allowed vlan 12,13,20-22,25,50,121
 no shutdown
exit
interface range GigabitEthernet0/1 - 2
 description PROXMOX-CORE
 switchport mode trunk
 switchport trunk allowed vlan 12,13,20-22,25,50,121
 channel-protocol lacp
 channel-group 10 mode active
 no shutdown
exit
!
interface Port-channel11
 description PROXMOX-DMZ-LACP
 switchport mode trunk
 switchport trunk allowed vlan 217,218
 no shutdown
exit
interface range GigabitEthernet0/3 - 4
 description PROXMOX-DMZ
 switchport mode trunk
 switchport trunk allowed vlan 217,218
 channel-protocol lacp
 channel-group 11 mode active
 no shutdown
exit
end
!
! Verify BEFORE saving:
! show etherchannel summary
! show lacp neighbor
! show interfaces trunk
! show vlan brief
! show mac address-table vlan 13
! copy running-config startup-config  (only after verification)
