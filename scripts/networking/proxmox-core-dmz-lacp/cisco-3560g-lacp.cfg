! Cisco Catalyst 3560G / Cisco IOS — assigned ports for this topology
! Gi0/27->nic0; Gi0/28->nic1 (CORE); Gi0/29->nic2; Gi0/30->nic3 (DMZ).
! Confirm the actual switch hostname, datacenter, cabling and free ports before applying.
! Catalyst 3560G allows channel-group/Port-channel numbers only 1-48.
! Do NOT use Po101/Po102 on this model; SERVER-101 is a description label.
! Do not apply on a live access uplink before coordinating host migration.
! VLAN 13 must remain TAGGED (not native); default native VLAN 1 shown by omission.
! Confirm VLANs already exist and are carried upstream toward their gateways.
! On 3560G set trunk encapsulation dot1q BEFORE switchport mode trunk.
! For existing EtherChannel members, IOS may require removing channel-group before changing encapsulation; inspect first.
! Po40 is reserved for an existing PBS access LACP on Gi0/25-26; DO NOT modify it.
! Preflight: verify Po41/42 are unused or dedicated to these exact member ports.
! If either group has unexpected members, STOP; do not delete or repurpose it.
! Base configuration only: STP edge hardening and DTP changes are not applied here.
configure terminal
!
interface Port-channel41
 description SERVER-101-CORE-LACP
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 12,13,20-22,25,50,121
 no shutdown
exit
interface range GigabitEthernet0/27 - 28
 description SERVER-101-CORE
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 12,13,20-22,25,50,121
 channel-protocol lacp
 channel-group 41 mode active
 no shutdown
exit
!
interface Port-channel42
 description SERVER-101-DMZ-LACP
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 217,218
 no shutdown
exit
interface range GigabitEthernet0/29 - 30
 description SERVER-101-DMZ
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 217,218
 channel-protocol lacp
 channel-group 42 mode active
 no shutdown
exit
end
!
! Verify BEFORE saving:
! show etherchannel summary
! show lacp neighbor
! show interfaces trunk
! show vlan brief
! show mac address-table vlan 13
! show spanning-tree interface port-channel 41 detail
! show spanning-tree interface port-channel 42 detail
! show interfaces status err-disabled
! copy running-config startup-config  (only after verification)
