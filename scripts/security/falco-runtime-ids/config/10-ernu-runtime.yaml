# ERNU.EU local Falco overrides.
# The upstream /etc/falco/falco.yaml remains authoritative for defaults.

engine:
  kind: modern_ebpf

json_output: true
json_include_output_property: true
json_include_tags_property: true

stdout_output:
  enabled: true

file_output:
  enabled: true
  keep_alive: false
  filename: /var/log/falco/events.json

# Keep alert volume focused during initial rollout.
priority: notice

# Custom rules are loaded after the upstream rules.
rules_files:
  - /etc/falco/falco_rules.yaml
  - /etc/falco/falco_rules.local.yaml
  - /etc/falco/rules.d
