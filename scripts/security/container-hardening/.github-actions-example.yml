# Example only. Move/adapt into .github/workflows/ of the target project.
name: Container security gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "compose*.yml"
      - "Dockerfile*"
      - "ops/security/container-hardening/**"

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate hardening scripts
        run: |
          cd ops/security/container-hardening
          bash scripts/validate-template.sh

