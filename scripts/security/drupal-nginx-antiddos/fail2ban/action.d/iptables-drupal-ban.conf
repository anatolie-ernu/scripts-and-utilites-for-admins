# =============================================================================
# iptables-drupal-ban.conf
# Varianta iptables + ipset a actiunii nftables-drupal-ban.conf.
# Folositi-o DOAR daca sistemul nu are nftables (ex: Debian/Ubuntu mai vechi,
# sau politica interna care impune iptables clasic). Nu combinati cele doua
# actiuni pe acelasi jail.
#
# De ce ipset si nu iptables "simplu": iptables clasic ar necesita o regula
# noua in lant pentru FIECARE IP banat, evaluata secvential (O(n)) -- la
# cateva mii de IP-uri banate, latenta per pachet creste vizibil. ipset tine
# IP-urile intr-o structura hash (hash:ip), cu lookup O(1) indiferent de
# numarul de IP-uri, si suporta expirare nativa per element (--timeout),
# exact echivalentul "flags timeout" din nftables.
#
# Necesita pachetele: ipset, iptables-persistent (pentru persistenta la reboot)
# =============================================================================

[Definition]

# Creeaza setul (daca nu exista) si insereaza regula de DROP in lant,
# o singura data, la prima pornire a jail-ului.
# "timeout 0" la nivel de set = fara expirare implicita a setului insusi;
# expirarea reala e data per-element la actionban, via --timeout <bantime>.
actionstart = ipset create <name> hash:ip timeout 0 -exist
              ipset create <name>6 hash:ip family inet6 timeout 0 -exist
              iptables  -C INPUT -m set --match-set <name>  src -j DROP 2>/dev/null || \
                  iptables  -I INPUT 1 -m set --match-set <name>  src -j DROP
              ip6tables -C INPUT -m set --match-set <name>6 src -j DROP 2>/dev/null || \
                  ip6tables -I INPUT 1 -m set --match-set <name>6 src -j DROP

actionstop = iptables  -D INPUT -m set --match-set <name>  src -j DROP 2>/dev/null
             ip6tables -D INPUT -m set --match-set <name>6 src -j DROP 2>/dev/null
             ipset destroy <name>  2>/dev/null
             ipset destroy <name>6 2>/dev/null

actioncheck = ipset list <name> >/dev/null 2>&1

# <ip>, <bantime> (secunde) si <family> sunt injectate automat de fail2ban
actionban = if [ "<family>" = "inet6" ]; then
                ipset add <name>6 <ip> timeout <bantime> -exist
            else
                ipset add <name> <ip> timeout <bantime> -exist
            fi

actionunban = if [ "<family>" = "inet6" ]; then
                  ipset del <name>6 <ip> -exist
              else
                  ipset del <name> <ip> -exist
              fi

[Init]
name = default
bantime = 3600
family = inet
