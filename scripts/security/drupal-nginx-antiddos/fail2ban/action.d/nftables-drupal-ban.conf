# =============================================================================
# nftables-drupal-ban.conf
# Actiune fail2ban care baneaza folosind SETURI nftables cu timeout per element,
# in loc de o regula noua per IP (mult mai eficient la volum mare de banuri).
#
# Fiecare jail primeste propriul set (parametrul "name"), astfel incat puteti
# vedea separat, de ex., cate IP-uri sunt banate din cauza scanarii de boti
# fata de cate din cauza alertelor de securitate agregate.
# =============================================================================

[Definition]

# Fiecare jail foloseste propria tabela. Oprirea unui jail nu sterge regulile
# celorlalte jail-uri, iar restarturile nu creeaza reguli duplicate.
actionstart = nft add table inet f2b_<name> 2>/dev/null
              nft add set inet f2b_<name> addr4 { type ipv4_addr\; flags timeout\; } 2>/dev/null
              nft add set inet f2b_<name> addr6 { type ipv6_addr\; flags timeout\; } 2>/dev/null
              nft add chain inet f2b_<name> input { type filter hook input priority -10\; policy accept\; } 2>/dev/null
              nft add rule inet f2b_<name> input ip saddr @addr4 counter drop 2>/dev/null
              nft add rule inet f2b_<name> input ip6 saddr @addr6 counter drop 2>/dev/null

actionstop = nft delete table inet f2b_<name> 2>/dev/null

actioncheck = nft list table inet f2b_<name> >/dev/null 2>&1

# <ip> e injectat de fail2ban; <bantime> vine din jail (in secunde)
actionban = if [ "<family>" = "inet6" ]; then
                nft add element inet f2b_<name> addr6 { <ip> timeout <bantime>s }
            else
                nft add element inet f2b_<name> addr4 { <ip> timeout <bantime>s }
            fi

actionunban = if [ "<family>" = "inet6" ]; then
                  nft delete element inet f2b_<name> addr6 { <ip> } 2>/dev/null
              else
                  nft delete element inet f2b_<name> addr4 { <ip> } 2>/dev/null
              fi

[Init]
name = default
bantime = 3600
family = inet
