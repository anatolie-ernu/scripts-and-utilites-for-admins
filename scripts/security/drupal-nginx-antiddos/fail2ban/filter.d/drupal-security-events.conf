# =============================================================================
# drupal-security-events.conf
# Filtru fail2ban pentru linia normalizata generata de
# scripts/security_log_processor.py in /var/log/nginx/security-events.log
#
# Format linie sursa (generat de procesor, NU de nginx direct):
# 2026-09-14T10:22:31+0300 SECURITY_ALERT ip=203.0.113.7 score=12
#   reason=login_bruteforce,path_probe path=/user/login count=6 window=60s
#
# <HOST> este tag-ul intern fail2ban care recunoaste IPv4/IPv6/hostname.
# =============================================================================

[Definition]
failregex = ^\S+ SECURITY_ALERT ip=<HOST> score=\d+ reason=\S+.*$
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S%%z
