# Detecteaza scanare de cai inexistente tipica boti/vulnerability scanners
# Se aplica pe drupal-access.log (format main_ext)
# Exemplu linie sursa:
# 203.0.113.7 - - [14/Sep/2026:10:22:31 +0300] "GET /wp-login.php HTTP/1.1" 404 162 ...

[Definition]
failregex = ^<HOST> -.*"(GET|POST|HEAD) .*(wp-login\.php|wp-admin|xmlrpc\.php|\.env|phpmyadmin|\.git).*" (404|403)
ignoreregex =
