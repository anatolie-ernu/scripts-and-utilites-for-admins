# Detecteaza IP-uri care lovesc constant limit_req/limit_conn (log in error.log)
# Exemplu linie sursa:
# 2026/09/14 10:22:31 [error] 1234#0: *5678 limiting requests, excess: 10.020 by
#   zone "general", client: 203.0.113.7, server: drupal.ernu.sec, request: "GET / HTTP/1.1"

[Definition]
failregex = ^.*\[error\].*limiting requests, excess:.* by zone.*client: <HOST>
            ^.*\[error\].*limiting connections by zone.*client: <HOST>
ignoreregex =
