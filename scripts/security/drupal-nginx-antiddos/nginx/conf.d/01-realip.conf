# =============================================================================
# 01-realip.conf
# ATENTIE: activati acest fisier NUMAI daca nginx sta in spatele unui
# reverse-proxy / load-balancer / CDN (Cloudflare, HAProxy, ALB etc).
# Fara el, TOATE limitele de rate/conn de mai sus se vor aplica pe IP-ul
# proxy-ului, nu pe IP-ul real al clientului -- ceea ce ar bloca instant
# tot traficul dupa primele cateva cereri.
# =============================================================================

# Exemplu generic pentru un reverse-proxy intern (ajustati la subnetul real):
# set_real_ip_from 192.0.2.0/24;     # interval de documentatie; inlocuiti-l
# set_real_ip_from 2001:db8::/32;    # interval de documentatie; inlocuiti-l

# Exemplu pentru Cloudflare (lista completa: cloudflare.com/ips):
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# set_real_ip_from 103.22.200.0/22;
# ... (adaugati toate rangurile IPv4 + IPv6 CF)
# real_ip_header CF-Connecting-IP;

# Pentru un LB generic care seteaza X-Forwarded-For:
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;
