# =============================================================================
# 00-security-globals.conf
# Setari globale anti-DDoS / anti-bruteforce pentru nginx (bloc http {})
# Se include din nginx.conf: include /etc/nginx/conf.d/*.conf;
# =============================================================================

# --- Ascunde versiunea nginx din headere si pagini de eroare ---
server_tokens off;

# =============================================================================
# RATE LIMITING (Layer 7)
# =============================================================================
# $binary_remote_addr ocupa 4 bytes (IPv4) / 16 bytes (IPv6) in loc de string,
# deci o zona de 10m tine evidenta a ~160.000 IP-uri unice.
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m   rate=2r/s;
limit_req_zone $binary_remote_addr zone=api:10m     rate=30r/s;
limit_req_zone $binary_remote_addr zone=cron:10m    rate=1r/m;

limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_conn_zone $server_name        zone=perserver:10m;

limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

# =============================================================================
# TIMEOUTS -- protectie anti-slowloris / slow-POST
# =============================================================================
client_body_timeout   10s;
client_header_timeout 10s;
keepalive_timeout     15s;
send_timeout          10s;

# =============================================================================
# BUFFERE -- limiteaza consumul de memorie per conexiune
# =============================================================================
client_body_buffer_size     16k;
client_header_buffer_size   1k;
client_max_body_size        8m;   # ajustati pentru upload-uri Drupal (imagini/media)
large_client_header_buffers 4 8k;

# =============================================================================
# DETECTIE BOTI / SCANERE CUNOSCUTE
# =============================================================================
map $http_user_agent $bad_bot {
    default 0;
    ""                                     1;  # User-Agent gol
    ~*(nikto|sqlmap|masscan|nmap|dirbuster|acunetix|nessus|w3af) 1;
}

# Cereri catre cai tipice de scanare (WordPress, .env, panouri admin generice)
# folosit ulterior pentru a alimenta logul de securitate custom
map $request_uri $probe_path {
    default 0;
    ~*/wp-login\.php          1;
    ~*/wp-admin                1;
    ~*/xmlrpc\.php              1;
    ~*\.env$                    1;
    ~*/\.git/                   1;
    ~*/phpmyadmin                1;
    ~*/vendor/                   1;
    ~*/(union|select|sleep\()    1;   # semnaturi SQLi simple in query string
    ~*/<script                   1;   # semnatura XSS simpla
}

# Combina semnalele intr-o singura variabila: cerere "suspecta"
map "$bad_bot:$probe_path" $suspicious {
    default 0;
    "~1"    1;
    "1:~"   1;
}

# Ce statusuri consideram relevante pentru logul de securitate
map $status $log_status_relevant {
    default 0;
    ~^4  1;   # toate 4xx
    ~^5  1;   # toate 5xx
}

# Decizie finala: se scrie in security.log daca e status relevant SAU cerere suspecta
map "$log_status_relevant:$suspicious" $log_security {
    default 0;
    "1:0"   1;
    "0:1"   1;
    "1:1"   1;
}

# =============================================================================
# FORMAT DE LOG CUSTOM PENTRU PIPELINE-UL DE SECURITATE
# Consumat de scripts/security_log_processor.py
# =============================================================================
log_format security '$time_iso8601 client=$remote_addr method=$request_method '
                     'uri="$request_uri" status=$status bytes=$body_bytes_sent '
                     'reqtime=$request_time ua="$http_user_agent" '
                     'ref="$http_referer" bot=$bad_bot probe=$probe_path '
                     'xff="$http_x_forwarded_for"';

log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" rt=$request_time';
