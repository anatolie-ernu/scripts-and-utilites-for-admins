# =============================================================================
# drupal-site.conf
# Server block Drupal 10/11 cu protectie anti-DDoS/bruteforce integrata.
# Ajustati: server_name, root, fastcgi_pass (socket/tcp php-fpm), certificate.
# =============================================================================

# Redirect HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name drupal.ernu.sec www.drupal.ernu.sec;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drupal.ernu.sec www.drupal.ernu.sec;

    root /var/www/drupal/web;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/drupal.ernu.sec/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drupal.ernu.sec/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # --- Loguri: acces standard extins + fluxul de securitate custom ---
    access_log /var/log/nginx/drupal-access.log main_ext;
    access_log /var/log/nginx/security-events.log security if=$log_security;
    error_log  /var/log/nginx/drupal-error.log warn;

    # --- Limite globale per conexiune ---
    limit_conn perip 20;
    limit_conn perserver 2000;

    # Boti/scanere cunoscute -> refuz brutal, fara raspuns HTTP (economiseste resurse)
    if ($bad_bot) {
        return 444;
    }

    # =========================================================================
    # FISIERE SENSIBILE / CAI CARE NU TREBUIE SA FIE NICIODATA ACCESIBILE
    # =========================================================================
    location ~ /\.(?!well-known) { deny all; }             # .git, .env, .htaccess etc
    location ~ ^/sites/.*/files/.*\.php$ { deny all; }      # PHP urcat in uploads
    location ~ /vendor/ { deny all; }
    location ~ /\.git { deny all; }
    location = /xmlrpc.php { deny all; }                    # nefolosit de Drupal, doar scanat
    location ~* ^/(README|CHANGELOG|composer|LICENSE).*(\.txt|\.md|\.yml|\.dist|\.lock)?$ {
        deny all;
    }

    # install.php / update.php -- restrictionati la IP-uri de administrare
    location ~ ^/(core/)?(install|update)\.php$ {
        # allow 1.2.3.4;   # IP-ul vostru de administrare
        # deny all;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        limit_req zone=general burst=5 nodelay;
    }

    # cron.php -- rar, dar poate fi tinta de abuz; rate-limit strict
    location = /cron.php {
        limit_req zone=cron burst=2 nodelay;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Formularul de login -- cel mai tintit endpoint pentru bruteforce
    location = /user/login {
        limit_req zone=login burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }
    location = /user/password {
        limit_req zone=login burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # API-uri JSON:API / REST din Drupal
    location ~ ^/(jsonapi|rest)/ {
        limit_req zone=api burst=50 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Restul rutelor Drupal (clean URLs)
    location / {
        limit_req zone=general burst=20 nodelay;
        try_files $uri /index.php?$query_string;
    }

    # Handler PHP-FPM standard
    location ~ '\.php$|^/update.php' {
        limit_req zone=general burst=20 nodelay;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60s;
        try_files $fastcgi_script_name =404;
    }

    location ~* \.(css|js|gif|jpe?g|png|svg|webp|ico|woff2?)$ {
        try_files $uri @rewrite;
        expires 1M;
        access_log off;
    }

    location @rewrite {
        rewrite ^/(.*)$ /index.php?q=$1;
    }
}
