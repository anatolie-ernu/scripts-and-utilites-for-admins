title = "ERNU DevSecOps Gitleaks policy"

[extend]
useDefault = true

[[allowlists]]
description = "Documented fake values and fixtures"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)fixtures?/''',
  '''(^|/)test-data/'''
]
regexes = [
  '''CHANGE_ME''',
  '''example\.invalid''',
  '''192\.0\.2\.([0-9]{1,3})'''
]

